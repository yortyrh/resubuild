packages:
  - apps/*
  - packages/*
allowBuilds:
  '@nestjs/core': true
  esbuild: true
  lefthook: true
  protobufjs: true
  puppeteer: true
  sharp: true
  # Optional native accelerators pulled in by testcontainers (dockerode → ssh2); not needed.
  cpu-features: false
  ssh2: false
  unrs-resolver: true
