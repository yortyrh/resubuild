# https://lefthook.dev/configuration/
pre-commit:
  piped: true
  commands:
    biome:
      glob: '*.{js,ts,cjs,mjs,d.cts,d.mts,jsx,tsx,json,jsonc}'
      run: pnpm exec biome check --write --no-errors-on-unmatched --files-ignore-unknown=true --colors=off {staged_files}
      stage_fixed: true
    prettier:
      glob: '*.{js,ts,cjs,mjs,jsx,tsx,json,jsonc,md,yml,yaml}'
      run: pnpm exec prettier --write --ignore-unknown {staged_files}
      stage_fixed: true

pre-push:
  commands:
    verified-commit:
      # `git push` connects to the remote before this hook runs, so running
      # `pnpm verify` here (minutes) left the SSH connection idle until GitHub
      # dropped it. `pnpm push` (scripts/push.mjs) runs env-schema:check and
      # verify first, records the verified HEAD in .git/, then pushes; this
      # check only compares the pushed commits with that record (milliseconds).
      # use_stdin passes git's "<local ref> <local sha> ..." lines through.
      # {all_files} opts out of lefthook's "no matching push files" skip so the
      # check always runs.
      use_stdin: true
      run: ': {all_files}; node scripts/check-push-stamp.mjs'
